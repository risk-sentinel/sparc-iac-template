    disposition: accepted
    rationale: "Go stdlib CVE embedded in compiled binaries. CI runner only — not deployed to production."
    nist_control: si-2
    reviewed_by: "@clem-field"
    discovery_date: "2026-04-03"
    next_review_date: "2026-05-03"

  - cve_id: CVE-2026-33186
    package: google.golang.org/grpc
    severity: CRITICAL
    disposition: accepted
    rationale: "gRPC CVE in Go binaries (Terraform, TruffleHog, cosign). Outbound connections only — not exposed as gRPC servers."
    nist_control: si-2
    reviewed_by: "@clem-field"
    discovery_date: "2026-04-03"
    next_review_date: "2026-05-03"

