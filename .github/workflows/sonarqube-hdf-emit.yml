name: SonarQube HDF emit

# This repo's caller for the reusable sonarqube-hdf.yml (#432) — fetch sparc-iac's
# SonarCloud findings, convert to OHDF, bake into the org security-artifacts
# bucket so SAST joins the unified compliance-evidence stream (Heimdall / checkov
# / SCA). SonarCloud analysis runs via the GitHub App; this runs after merge to
# main (results are current by then) and on demand.
#
# Producer selection (cross-repo parity): the org Actions variable
# SONARQUBE_HDF_USE_SAF flips all repos to the SAF bridge in lockstep.
# Unset/anything-but-"true" → the strategic Go hdf-cli (the default, preferred).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      use_saf:
        description: 'Override: use the SAF CLI bridge instead of hdf-cli for this run.'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write          # AWS OIDC for the S3 emit (passed to the reusable)

jobs:
  emit:
    uses: ./.github/workflows/sonarqube-hdf.yml
    with:
      # Derived, not hardcoded. These used to name sparc-iac literally, which is
      # correct exactly once: run anywhere else — the published template, an
      # adopter fork — and the job scans this repo's Sonar project and writes
      # evidence under this repo's slug. On sparc-iac-template that is not a
      # collision but an AccessDenied, because its emit role is scoped to
      # sparc/*/sparc-iac-template/*, so the evidence silently never lands (#672).
      sonar_project_key: ${{ github.repository_owner }}_${{ github.event.repository.name }}
      sonar_organization: ${{ github.repository_owner }}
      repo_slug: ${{ github.event.repository.name }}
      # Default = hdf-cli. The org variable flips every repo to SAF together
      # (parity); a workflow_dispatch input can override for a one-off run.
      use_saf: ${{ inputs.use_saf || vars.SONARQUBE_HDF_USE_SAF == 'true' }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # Canonical-only evidence-emit role (#654, superseding the #432 sonarqube-scoped
      # one): OIDC-assumable by this repo, s3:PutObject scoped to
      # <boundary>/*/sparc-iac/* and nothing else. Load its ARN (the
      # profile_emit_role_arns["sparc-iac"] output) as the SPARC_IAC_TEMPLATE_EMIT_ARN org secret.
      # It holds NO grant on the legacy sonarqube/sparc-iac/ prefix, which is why the
      # write path in the reusable moved in this same change — swapping the ARN alone
      # would 403 on every upload.
      # Absent/unauthorized → the reusable converts + validates but skips upload.
      S3_EMIT_ROLE_ARN: ${{ secrets.SPARC_IAC_TEMPLATE_EMIT_ARN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
