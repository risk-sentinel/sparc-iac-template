name: Build cinc-auditor image

# Builds and publishes risksentinel/cinc-auditor to Docker Hub.
# See docs/dev/cinc_image_pinning.md for the version-bump runbook.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (e.g., 26.0.1-rs1). Must match the workstation base version + risk-sentinel iteration.'
        required: true
        default: '26.0.1-rs1'
      push:
        description: 'Push to Docker Hub after build + verification (uncheck for build-only test runs).'
        required: true
        default: 'true'
        type: boolean
  push:
    tags:
      - 'cinc-image-v*'

permissions:
  contents: read

jobs:
  build:
    if: vars.SPARC_DEPLOY_ENABLED == 'true'
    name: Build cinc-auditor
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      IMAGE: risksentinel/cinc-auditor

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG='${{ inputs.tag }}'
            PUSH='${{ inputs.push }}'
          else
            # Tag trigger — strip the cinc-image-v prefix from the git ref.
            TAG="${GITHUB_REF#refs/tags/cinc-image-v}"
            PUSH=true
          fi
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "push=$PUSH"   >> "$GITHUB_OUTPUT"
          echo "image_ref=$IMAGE:$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.tag.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Single-arch build: cincproject/workstation:26.0.1 is amd64-only.
      # Verified 2026-05-08 — no linux/arm64/v8 variant published.
      # Build to local docker daemon for verification, then push if approved.
      - name: Build image (amd64, load to local for verification)
        uses: docker/build-push-action@v6
        with:
          context: containers/cinc-auditor
          platforms: linux/amd64
          tags: ${{ steps.tag.outputs.image_ref }}
          load: true
          push: false

      # Verification battery — all three must succeed before push. Catches:
      # (a) gem-load regressions (the value prop), (b) ENTRYPOINT regressions
      # (sparc-validate workflow contract), (c) Ohai-readiness regressions
      # (the reason we chose workstation over auditor).

      - name: Verify gem load
        run: |
          docker run --rm --entrypoint /opt/cinc-workstation/embedded/bin/ruby \
            ${{ steps.tag.outputs.image_ref }} \
            -e "%w[aws-sdk-workspacesweb aws-sdk-workdocs aws-sdk-appstream aws-sdk-lightsail aws-sdk-apprunner aws-sdk-simspaceweaver aws-sdk-memorydb aws-sdk-keyspaces aws-sdk-timestreamwrite aws-sdk-workspaces aws-sdk-accessanalyzer aws-sdk-inspector2 aws-sdk-pi aws-sdk-backup aws-sdk-macie2 aws-sdk-wafv2 aws-sdk-resourcegroupstaggingapi aws-sdk-auditmanager aws-sdk-detective pg].each { |g| require g; puts \"loaded: #{g}\" }; puts 'all-gems-loadable'"

      - name: Verify cinc-auditor entrypoint
        run: |
          # Should print the bundled cinc-auditor version (e.g., 7.0.107
          # for workstation 26.0.1). Non-zero exit fails the workflow.
          docker run --rm ${{ steps.tag.outputs.image_ref }} --version

      - name: Verify Ohai available
        run: |
          # Should print "Ohai: <version>" — proves the workstation base's
          # Ohai is callable. This is the primary reason we chose
          # workstation over auditor.
          docker run --rm --entrypoint ohai ${{ steps.tag.outputs.image_ref }} --version

      # Push happens only after all three verifications pass.
      - name: Push to Docker Hub
        if: steps.tag.outputs.push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: containers/cinc-auditor
          platforms: linux/amd64
          tags: ${{ steps.tag.outputs.image_ref }}
          push: true

      - name: Capture published digest
        if: steps.tag.outputs.push == 'true'
        run: |
          DIGEST=$(docker buildx imagetools inspect ${{ steps.tag.outputs.image_ref }} --format '{{json .Manifest}}' | jq -r '.digest')
          echo "## Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ steps.tag.outputs.image_ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Digest: \`$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Update sparc-validate \`Image_Pinning_Policy.md\` to reference this digest." >> "$GITHUB_STEP_SUMMARY"
