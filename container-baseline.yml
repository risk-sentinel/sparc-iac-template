# container-baseline.yml — CI runner container CVE disposition tracking
#
# Follows the same workflow as checkov-baseline.yml:
#   discovered → triaged → accepted/deferred/remediated
#
# CVEs are from the sparc-ci-runner container image scanned by Trivy.
# These are build-time tools, NOT deployed to production infrastructure.
#
# Risk context: These tools run in ephemeral CI runners with no access
# to customer data. Attack surface is limited to the CI pipeline itself.
# Supply chain risk is mitigated by cosign image signing and Trivy
# scanning on every build.
#
# New HIGH or CRITICAL CVEs not in this baseline will block the build.

findings:

  # ==========================================================================
  # CRITICAL — Accepted (5 unique CVEs)
  # ==========================================================================

  # ── Node.js / SAF CLI dependencies ────────────────────────────────────
  - cve_id: CVE-2026-25896
    package: fast-xml-parser
    severity: CRITICAL
    disposition: accepted
    rationale: "Transitive dependency of @mitre/saf. XML parsing vulnerability — SAF CLI only processes trusted HDF/SARIF inputs from our own scan tools, not untrusted XML. No user-controlled XML input path."
    nist_control: si-10
    reviewed_by: "@clem-field"
    discovery_date: "2026-04-03"
    next_review_date: "2026-05-03"

  # ── Go stdlib (embedded in Terraform/TruffleHog/cosign binaries) ──────
  - cve_id: CVE-2024-45337
    package: golang.org/x/crypto
    severity: CRITICAL
    disposition: accepted
    rationale: "Go crypto CVE in Terraform binary. CI runner only — outbound TLS connections to AWS APIs. No inbound attack surface."
    nist_control: si-2
    reviewed_by: "@clem-field"
    discovery_date: "2026-04-03"
    next_review_date: "2026-05-03"

  - cve_id: CVE-2025-68121
    package: stdlib (Go)
